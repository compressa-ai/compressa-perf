[tool.poetry]
name = "compressa-perf"
version = "0.2.8"
description = "Performance Measurement tool by Compressa"
authors = ["Gleb Morgachev <morgachev.g@gmail.com>", "Fedor Konovalenko <fdkonovalenko@gmail.com>"]
readme = "README.md"
packages = [{include = "compressa", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4"
python-dotenv = ">=1.2.2,<2"
openai = "^1.47.1"
tabulate = "^0.9.0"
pandas = "^2.2.3"
requests = ">=2.33.0,<3"
pyyaml = ">=5.1"
reportlab = "^4.4.2"

[tool.poetry.group.dev.dependencies]
jupyterlab = ">=4.5.10,<5"
black = ">=26.3.1,<27"
datasets = "^3.0.1"
transformers = ">=5.10.0,<6"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry.scripts]
compressa-perf = "compressa.perf.cli.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"